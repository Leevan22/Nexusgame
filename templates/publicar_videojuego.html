<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publicar videojuego - Nexusgame</title>
</head>
<body>

    <h1>Publicar nuevo videojuego</h1>
    <p>Ingresa los datos del juego para agregarlo al catalogo.</p>

    <p><a href="{% url 'inicio' %}">Volver al inicio</a></p>

    <hr>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Guardar videojuego</button>
    </form>

</body>
</html>
