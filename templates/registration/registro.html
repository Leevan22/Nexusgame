<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de usuario - Nexusgame</title>
</head>
<body>

    <h1>Registro de nuevo usuario</h1>
    <p>Crea tu cuenta para publicar juegos y solicitar tratos.</p>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Registrarme</button>
    </form>

    <br>
    <p>Ya tienes cuenta? <a href="{% url 'login' %}">Iniciar sesion</a></p>

</body>
</html>
