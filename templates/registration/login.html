<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesion - Nexusgame</title>
</head>
<body>

    <h1>Iniciar sesion</h1>
    <p>Ingresa con tu cuenta para acceder a Nexusgame.</p>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Entrar</button>
    </form>

    <br>
    <p>No tienes cuenta? <a href="{% url 'registro' %}">Registrarse aqui</a></p>

</body>
</html>
